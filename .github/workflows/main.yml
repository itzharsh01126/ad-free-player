name: Build signed APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Prepare signing key
        env:
          B64: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          CLEAN=$(printf '%s' "$PW" | tr -d ' \r\n')
          echo "::add-mask::$CLEAN"
          echo "SIGN_PW=$CLEAN" >> "$GITHUB_ENV"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$CLEAN" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD or KEYSTORE_BASE64 secret is wrong. Re-add both by copy-paste."
            exit 1
          fi
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ env.SIGN_PW }}
          KEY_ALIAS: adfree
          KEY_PASSWORD: ${{ env.SIGN_PW }}
        run: gradle assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AdFreePlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AdFreePlayer-apk
          path: AdFreePlayer.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AdFreePlayer.apk
