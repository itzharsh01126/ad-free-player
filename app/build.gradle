plugins { id 'com.android.application' }

def hasSigning = System.getenv("KEYSTORE_PASSWORD") != null

android {
    namespace 'com.example.litebrowser'
    compileSdk 34
    defaultConfig {
        applicationId "app.adfreeplayer"
        minSdk 24          // Android 7.0 and above
        targetSdk 33
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0"
    }
    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
